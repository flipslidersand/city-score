[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "city-score"
version = "0.1.0"
description = "居住地スコアリングエンジン — キャリア持続性・人生コスト効率・老後就労等の独自指標で住みやすさを評価"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "flipslidersand" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
city-score = "city_score.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]
ui = [
    "streamlit>=1.35",
    "plotly>=5.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"city_score.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=city_score --cov-report=term-missing --cov-fail-under=60"
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
